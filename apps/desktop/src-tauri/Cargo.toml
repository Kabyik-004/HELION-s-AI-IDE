[package]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI - an AI-native desktop IDE"
authors = ["ForgeAI contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
# Tauri builds the app logic as a library so the same code can be reused by mobile targets.
name = "forgeai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core.
tauri = { version = "2", features = [] }
# The native folder picker, used by "Open Folder". Narrowed to `dialog:allow-open` in
# capabilities/default.json — the app cannot save, message or confirm through this plugin.
tauri-plugin-dialog = "2"
# Secure credential storage via OS keychain.
keyring = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Real temporary directories for the workspace file-system unit tests.
tempfile = "3"

[features]
default = []
