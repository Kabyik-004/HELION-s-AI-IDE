[package]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI - an AI-native desktop IDE"
authors = ["ForgeAI contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
# Tauri builds the app logic as a library so the same code can be reused by mobile targets.
name = "forgeai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core. No plugins are enabled in Module 0 on purpose: every OS capability must be
# added deliberately, together with its permission entry, in the module that needs it.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
